name: CI

# Portão de validação do projeto. Existe porque o ambiente onde o Claude trabalha
# não alcança `binaries.prisma.sh`: sem os binários do Prisma, o cliente não é
# gerado e `tsc`/`next build` não rodam lá. Nos runners do GitHub rodam, então é
# aqui que a validação de verdade acontece antes de qualquer merge na `main`.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Credenciais do ambiente de TESTE. Nenhuma etapa deste job escreve no banco:
      # `prisma generate`, `tsc` e os testes não conectam, e o build só precisa da
      # string para espelhar o que a Vercel faz. Enquanto os secrets não existirem,
      # o placeholder abaixo mantém o CI útil (tipos, testes e lint continuam
      # valendo); só o build é que pode exigir a string real.
      AMBIENTE: teste
      DATABASE_URL: ${{ secrets.TESTE_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
      CENTRAL_DATABASE_URL: ${{ secrets.TESTE_CENTRAL_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
      TENANT_PRINCIPAL_DATABASE_URL: ${{ secrets.TESTE_TENANT_PRINCIPAL_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
      TENANT_CUNHADO_DATABASE_URL: ${{ secrets.TESTE_TENANT_CUNHADO_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
      CRON_SECRET: ci-sem-uso
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` já dispara o postinstall, que gera os dois clientes Prisma.
      - name: Instalar dependências
        run: |
          set -o pipefail
          codificar() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }

          if ! npm ci 2>&1 | tee /tmp/npm.log; then
            echo "::error::Falha em npm ci:%0A$(tail -40 /tmp/npm.log | codificar)"
            exit 1
          fi

      # Mesmo envelope das demais: uma falha aqui chegava como "exit code 1"
      # sem causa nenhuma, porque so as etapas seguintes publicavam anotacao.
      - name: Validar os dois schemas Prisma
        run: |
          set -o pipefail
          codificar() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }

          if ! { npx prisma validate && npm run prisma:central:validate; } 2>&1 | tee /tmp/prisma.log; then
            echo "::error::Falha ao validar os schemas Prisma:%0A$(tail -40 /tmp/prisma.log | codificar)"
            exit 1
          fi

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migrations reproduzem o schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres descartável. Serve como shadow database: as migrations commitadas são
    # aplicadas nele e o `migrate diff` contra o schema.prisma tem que sair vazio.
    # É o que garante que uma migration escrita à mão (o `migrate dev` é proibido
    # neste projeto, e o ambiente do Claude não roda o CLI do Prisma) realmente
    # produz o schema declarado — sem depender de nenhum banco real.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sombra
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:sombra@127.0.0.1:5432/tenant_sombra
      CENTRAL_DATABASE_URL: postgresql://postgres:sombra@127.0.0.1:5432/central_sombra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar os dois bancos de sombra
        run: |
          export PGPASSWORD=sombra
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE tenant_sombra;'
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE central_sombra;'

      - name: Aplicar as migrations commitadas
        run: |
          npx prisma migrate deploy
          npm run prisma:central:migrate:deploy

      # --exit-code sai com 2 quando há diferença. Diferença aqui significa uma de
      # duas coisas: o schema.prisma mudou sem migration, ou a migration escrita à
      # mão não reproduz o schema. As duas são erro.
      - name: Tenant — migrations em dia com o schema
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script --exit-code > /tmp/diff-tenant.sql \
          && echo "sem divergência" \
          || { echo "::error::As migrations do tenant não reproduzem prisma/schema.prisma. SQL faltante:"; cat /tmp/diff-tenant.sql; exit 1; }

      - name: Central — migrations em dia com o schema
        run: |
          npx prisma migrate diff \
            --config prisma.central.config.ts \
            --from-config-datasource \
            --to-schema prisma/central/schema.prisma \
            --script --exit-code > /tmp/diff-central.sql \
          && echo "sem divergência" \
          || { echo "::error::As migrations do central não reproduzem prisma/central/schema.prisma. SQL faltante:"; cat /tmp/diff-central.sql; exit 1; }

      # O SQL cru do projeto só é validado quando um banco recebe a consulta:
      # erro de sintaxe, nome de coluna errado ou cast impossível não aparecem
      # em `tsc` nem em teste de unidade — aparecem quando alguém abre a tela.
      # Aqui o shadow database já tem o schema real aplicado, então as consultas
      # rodam de verdade. No caso da lista de propostas, a verificação também
      # confere que a ordem que o Postgres produz é a mesma que
      # `lib/dominio/propostas/situacao.ts` calcula em TypeScript — as duas
      # implementações da regra não podem divergir em silêncio.
      - name: SQL cru roda contra o schema real
        env:
          SOMBRA_DATABASE_URL: postgresql://postgres:sombra@127.0.0.1:5432/tenant_sombra
        run: npm run verificar:consultas

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.TESTE_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
      CENTRAL_DATABASE_URL: ${{ secrets.TESTE_CENTRAL_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Job separado de propósito: uma falha de lint não esconde o resultado dos
      # tipos, dos testes e do build.
      - name: ESLint
        run: npm run lint

  master:
    name: Sistema master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: master/package-lock.json

      # O master gera o cliente do banco central a partir do schema do ERP
      # (master/scripts/gerar-cliente-central.mjs): este job tambem pega uma
      # mudanca no schema central que quebre o master.
      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      # O build do Next confere os tipos.
      - name: Build
        run: npm run build
