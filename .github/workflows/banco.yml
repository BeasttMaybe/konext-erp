name: Banco (sob demanda)

# Migrations e scripts de banco rodam aqui porque o ambiente onde o Claude trabalha
# não alcança o Neon (host bloqueado, e a porta 5432 não passa pelo proxy). O runner
# do GitHub alcança, então este é o lugar onde `npm run db:*` roda sem precisar de
# ninguém abrindo o Prompt de Comando.
#
# As travas NÃO estão neste arquivo — estão nos próprios scripts, onde sempre
# estiveram: `--dry-run` é o padrão, `--aplicar` exige CONFIRMAR=SIM e
# PONTO_RESTAURACAO, SQL destrutivo exige AUTORIZAR_DESTRUTIVO=SIM, e nenhuma
# connection string com `-pooler` é aceita. O que este arquivo acrescenta é o
# `environment`, que deixa você exigir aprovação manual para produção nas
# configurações do repositório (Settings → Environments → producao → Required
# reviewers).

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Banco alvo"
        type: choice
        required: true
        default: teste
        options: [teste, producao]
      comando:
        description: "O que rodar"
        type: choice
        required: true
        default: migrar-dry-run
        options:
          - verificar-ambiente
          - diagnostico
          - migrar-dry-run
          - migrar-aplicar
          - central-dry-run
          - central-aplicar
          - cifrar-senhas-dry-run
          - cifrar-senhas-aplicar
          - ensaio-restauracao
          - relatorio-os
          - verificar-datas
          - verificar-dinheiro
      tenant:
        description: "Slug de um único tenant (vazio = todos)"
        type: string
        required: false
      ponto_restauracao:
        description: "Branch Neon de restauração. Vazio = criado automaticamente pela API do Neon"
        type: string
        required: false
      confirmo_producao:
        description: "Para ambiente=producao, digite exatamente: APLICAR EM PRODUCAO"
        type: string
        required: false
      autorizar_destrutivo:
        description: "Permitir SQL destrutivo (DROP, ALTER TYPE, UPDATE...)"
        type: boolean
        required: false
        default: false
      modo_verificacao:
        # Só para verificar-datas e verificar-dinheiro. Os dois são scripts
        # PAREADOS de verificação de migração: `antes` tira o retrato do banco
        # como ele está, `depois` compara contra esse retrato. Sem o parâmetro
        # os dois saem com erro de uso — era o que acontecia, porque o bloco
        # de comandos abaixo nunca passava nenhum.
        description: "Para verificar-datas/dinheiro: antes (antes da migration) ou depois"
        type: choice
        required: false
        default: antes
        options: [antes, depois]

concurrency:
  # Nunca dois comandos de banco no mesmo ambiente ao mesmo tempo.
  group: banco-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  executar:
    name: ${{ inputs.comando }} em ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMBIENTE: ${{ inputs.ambiente }}
      # Environments com regra de protecao exigem plano pago em repositorio
      # privado, entao os segredos ficam no repositorio com prefixo e a escolha
      # acontece aqui, pelo ambiente informado no disparo.
      DATABASE_URL: ${{ inputs.ambiente == 'producao' && secrets.PROD_DATABASE_URL || secrets.TESTE_DATABASE_URL }}
      CENTRAL_DATABASE_URL: ${{ inputs.ambiente == 'producao' && secrets.PROD_CENTRAL_DATABASE_URL || secrets.TESTE_CENTRAL_DATABASE_URL }}
      TENANT_PRINCIPAL_DATABASE_URL: ${{ inputs.ambiente == 'producao' && secrets.PROD_TENANT_PRINCIPAL_DATABASE_URL || secrets.TESTE_TENANT_PRINCIPAL_DATABASE_URL }}
      TENANT_CUNHADO_DATABASE_URL: ${{ inputs.ambiente == 'producao' && secrets.PROD_TENANT_CUNHADO_DATABASE_URL || secrets.TESTE_TENANT_CUNHADO_DATABASE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Primeira coisa depois de instalar, antes de qualquer comando. Existe
      # porque o atalho `ambiente == 'producao' && secrets.PROD_X ||
      # secrets.TESTE_X` cai calado no valor de TESTE quando o segredo PROD_
      # esta ausente — string vazia e falsa em expressao do GitHub. Um dry-run
      # de producao chegou a ler o banco de TESTE por causa disso.
      # Pede as strings ao proprio Neon, do branch do ambiente, ja sem -pooler.
      # Remove a necessidade de manter copias das credenciais em secrets: a
      # NEON_API_KEY ja existe, e o Neon ja sabe qual e a string de cada branch.
      # Nada e impresso — o script registra cada valor com ::add-mask:: antes de
      # exportar.
      - name: Resolver conexões pelo Neon
        if: env.NEON_API_KEY != ''
        run: node scripts/neon/exportar-conexoes.mjs --ambiente "${{ inputs.ambiente }}"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Conferir que as conexões são do ambiente pedido
        run: |
          set -o pipefail
          codificar() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }

          if ! node scripts/verificacao/conferir-conexoes-do-ambiente.mjs \
              --ambiente "${{ inputs.ambiente }}" 2>&1 | tee /tmp/conexoes.log; then
            echo "::error::Conexões não conferem com o ambiente \"${{ inputs.ambiente }}\":%0A$(tail -30 /tmp/conexoes.log | codificar)"
            exit 1
          fi

      # Ponto de restauração: criado aqui, antes de qualquer escrita. A regra do
      # projeto nunca foi "alguém cria à mão" — era "existe um ponto de
      # restauração recém-criado". Criar pela API mantém a regra e remove a
      # dependência de uma pessoa estar disponível para cada migração.
      #
      # Se `ponto_restauracao` vier preenchido, ele é respeitado como está: é a
      # saída para quando o branch já foi criado à mão.
      # Nao substitui o Required reviewers (indisponivel no plano Free em repo
      # privado): nao impede quem dispara, impede o disparo por engano e deixa a
      # intencao registrada no historico do run.
      - name: Confirmar intenção de escrever em produção
        if: inputs.ambiente == 'producao' && endsWith(inputs.comando, '-aplicar')
        run: |
          if [ "${{ inputs.confirmo_producao }}" != "APLICAR EM PRODUCAO" ]; then
            echo "::error::Para aplicar em producao, confirmo_producao precisa ser exatamente: APLICAR EM PRODUCAO"
            exit 1
          fi

      - name: Criar ponto de restauração no Neon
        id: restauracao
        if: endsWith(inputs.comando, '-aplicar')
        run: |
          set -o pipefail

          if [ -n "${{ inputs.ponto_restauracao }}" ]; then
            echo "Usando o ponto de restauração informado: ${{ inputs.ponto_restauracao }}"
            echo "ponto=${{ inputs.ponto_restauracao }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::migrar-aplicar sem ponto_restauracao exige o secret NEON_API_KEY (para criar o branch automaticamente), ou informe ponto_restauracao com um branch criado à mão."
            exit 1
          fi

          codificar() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }

          if ! node scripts/neon/criar-ponto-restauracao.mjs \
              --prefixo "antes-${{ inputs.ambiente }}" 2>&1 | tee /tmp/restauracao.log; then
            echo "::error::Falha ao criar o ponto de restauracao:%0A$(tail -40 /tmp/restauracao.log | codificar)"
            exit 1
          fi

          PONTO=$(grep -oP '^PONTO_RESTAURACAO=\K.*' /tmp/restauracao.log | tail -1)
          if [ -z "$PONTO" ]; then
            echo "::error::O script terminou sem devolver um ponto de restauracao:%0A$(tail -40 /tmp/restauracao.log | codificar)"
            exit 1
          fi
          echo "ponto=$PONTO" >> "$GITHUB_OUTPUT"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Abre o endereco das lojas criadas pelo master (cofre no banco central).
          CHAVE_DAS_CONEXOES: ${{ secrets.CHAVE_DAS_CONEXOES }}

      - name: Rodar
        env:
          PONTO_RESTAURACAO: ${{ steps.restauracao.outputs.ponto }}
          CONFIRMAR: ${{ endsWith(inputs.comando, '-aplicar') && 'SIM' || '' }}
          AUTORIZAR_DESTRUTIVO: ${{ inputs.autorizar_destrutivo && 'SIM' || '' }}
          CHAVE_DAS_CONEXOES: ${{ secrets.CHAVE_DAS_CONEXOES }}
          # So o ensaio-restauracao usa (cria e apaga um branch temporario).
          NEON_API_KEY: ${{ inputs.comando == 'ensaio-restauracao' && secrets.NEON_API_KEY || '' }}
        run: |
          set -o pipefail
          ALVO_TENANT=""
          if [ -n "${{ inputs.tenant }}" ]; then
            ALVO_TENANT="--tenant ${{ inputs.tenant }}"
          fi

          # A saida vai tambem para anotacao porque o log bruto do run fica num
          # blob externo que o ambiente do Claude nao alcanca — e o plano de uma
          # migration precisa ser LIDO antes de decidir aplicar, nao so arquivado.
          # Os scripts mascaram host e nunca imprimem credencial (ver
          # scripts/lib/conexao-somente-leitura.mjs).
          executar() {
            case "${{ inputs.comando }}" in
              verificar-ambiente)   npm run verificar:ambiente ;;
              diagnostico)          npm run db:diagnostico ;;
              migrar-dry-run)       npm run db:migrar -- --dry-run $ALVO_TENANT ;;
              migrar-aplicar)       npm run db:migrar -- --aplicar $ALVO_TENANT ;;
              central-dry-run)      node scripts/migracao/migrar-central.mjs --dry-run ;;
              central-aplicar)      node scripts/migracao/migrar-central.mjs --aplicar ;;
              cifrar-senhas-dry-run) npm run db:cifrar-senhas -- --dry-run $ALVO_TENANT ;;
              cifrar-senhas-aplicar) npm run db:cifrar-senhas -- --aplicar $ALVO_TENANT ;;
              ensaio-restauracao)   node scripts/neon/ensaio-de-restauracao.mjs --ambiente "${{ inputs.ambiente }}" ;;
              relatorio-os)         npm run db:relatorio-os ;;
              verificar-datas)      npm run db:verificar-datas -- --${{ inputs.modo_verificacao || 'antes' }} ;;
              verificar-dinheiro)   npm run db:verificar-dinheiro -- --${{ inputs.modo_verificacao || 'antes' }} ;;
              *) echo "comando desconhecido" >&2; return 1 ;;
            esac
          }

          codificar() {
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$1" | awk '{printf "%s%%0A", $0}'
          }

          if executar 2>&1 | tee /tmp/banco.log; then
            echo "::notice::Saida de ${{ inputs.comando }} em ${{ inputs.ambiente }}:%0A$(tail -120 /tmp/banco.log | codificar /dev/stdin)"
          else
            echo "::error::Falha em ${{ inputs.comando }} em ${{ inputs.ambiente }}:%0A$(tail -120 /tmp/banco.log | codificar /dev/stdin)"
            exit 1
          fi

      # Relatórios dos scripts de diagnóstico/verificação, para leitura depois.
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ inputs.ambiente }}-${{ github.run_id }}
          path: docs/diagnostico/
          if-no-files-found: ignore
          retention-days: 30
